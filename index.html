<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip to Jogja</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Arial', sans-serif;
        }

        /* Latar Belakang Gradasi Animasi */
        .bg-animated {
            /* Kombinasi warna senja/aesthetic */
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a18cd1, #fbc2eb);
            background-size: 400% 400%;
            animation: gradientMove 10s ease infinite;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Efek pergerakan warna */
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .menu-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 80%;
            max-width: 320px;
        }

        .menu-btn {
            background-color: rgba(255, 255, 255, 0.85); /* Sedikit transparan biar gradasinya tembus */
            border: 2px solid #fff;
            border-radius: 12px;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            color: #333;
            cursor: pointer;
            transition: all 0.3s ease;
            display: block;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }

        .menu-btn:hover {
            transform: translateY(-3px);
            background-color: #fff;
            box-shadow: 0 15px 20px rgba(0,0,0,0.2);
        }

        .sub-menu {
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-top: -10px;
            margin-bottom: 5px;
        }

        .sub-menu.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .sub-btn {
            background-color: rgba(255, 255, 255, 0.7);
            border: 1px solid #fff;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            text-align: center;
            text-decoration: none;
            color: #444;
            width: 90%;
            margin: 0 auto;
            box-sizing: border-box;
            transition: background-color 0.2s;
        }

        .sub-btn:hover {
            background-color: rgba(255, 255, 255, 0.9);
        }
    </style>
</head>
<body>

    <div class="bg-animated">
        <div class="menu-container">
            <a href="schedule.html" class="menu-btn">Schedule</a>
            <a href="maps.html" class="menu-btn">Maps</a>
            <a href="list.html" class="menu-btn">List</a>
            <button class="menu-btn" onclick="toggleSubMenu()">Check List</button>
            
            <div class="sub-menu" id="checkListMenu">
                <a href="list-berangkat.html" class="sub-btn">List Berangkat</a>
                <a href="list-pulang.html" class="sub-btn">List Pulang</a>
            </div>
        </div>
    </div>

    <script>
        function toggleSubMenu() {
            const menu = document.getElementById("checkListMenu");
            menu.classList.toggle("active");
        }
    </script>
</body>
</html>
