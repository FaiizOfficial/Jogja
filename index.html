<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip to Jogja</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Arial', sans-serif;
        }

        /* Latar belakang foto */
        .bg-image {
            /* Ganti link di bawah ini dengan foto Jogja lu. Bisa pakai file lokal misal: url('foto-jogja.jpg') */
            background-image: url('https://images.unsplash.com/photo-1584897274092-3dc3c3c13840?q=80&w=1000&auto=format&fit=crop');
            height: 100%;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Overlay gelap agar tombol dan teks tetap jelas */
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.4);
        }

        /* Wadah untuk tombol-tombol (sesuai sketsa HP) */
        .menu-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 80%;
            max-width: 320px; /* Ukuran standar layar HP */
        }

        /* Gaya tombol utama seperti kotak di sketsa */
        .menu-btn {
            background-color: rgba(255, 255, 255, 0.9);
            border: 2px solid #333;
            border-radius: 8px;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            color: #333;
            cursor: pointer;
            transition: transform 0.2s;
            display: block;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }

        .menu-btn:hover {
            transform: scale(1.02);
            background-color: #fff;
        }

        /* Gaya untuk sub-menu (List Berangkat & Pulang) */
        .sub-menu {
            display: none; /* Disembunyikan dari awal */
            flex-direction: column;
            gap: 10px;
            margin-top: -10px; /* Dirapatkan ke tombol atasnya */
            margin-bottom: 5px;
        }

        .sub-menu.active {
            display: flex; /* Ditampilkan saat tombol diklik */
        }

        .sub-btn {
            background-color: rgba(255, 255, 255, 0.7);
            border: 1px solid #555;
            border-radius: 6px;
            padding: 12px;
            font-size: 16px;
            text-align: center;
            text-decoration: none;
            color: #222;
            width: 90%;
            margin: 0 auto;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="bg-image">
        <div class="overlay"></div>
        
        <div class="menu-container">
            <!-- Tombol 1: Schedule -->
            <!-- Atribut href diisi dengan nama file HTML yang nanti bakal kita buat -->
            <a href="schedule.html" class="menu-btn">Schedule</a>
            
            <!-- Tombol 2: Maps -->
            <a href="maps.html" class="menu-btn">Maps</a>
            
            <!-- Tombol 3: List -->
            <a href="list.html" class="menu-btn">List</a>
            
            <!-- Tombol 4: Check List -->
            <!-- Pakai tag button karena fungsinya untuk memunculkan menu lain di halaman ini -->
            <button class="menu-btn" onclick="toggleSubMenu()">Check List</button>
            
            <!-- Sub-menu Pilihan Check List -->
            <div class="sub-menu" id="checkListMenu">
                <a href="list-berangkat.html" class="sub-btn">List Berangkat</a>
                <a href="list-pulang.html" class="sub-btn">List Pulang</a>
            </div>
        </div>
    </div>

    <script>
        // Fungsi JavaScript untuk memunculkan/menyembunyikan pilihan Check List
        function toggleSubMenu() {
            const menu = document.getElementById("checkListMenu");
            // toggle akan menambah class 'active' jika belum ada, dan menghapus jika sudah ada
            menu.classList.toggle("active");
        }
    </script>
</body>
</html>
