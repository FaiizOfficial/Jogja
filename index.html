<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip to Jogja</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Arial', sans-serif;
        }

        .bg-image {
            background-image: url('jogja.jpg');
            height: 100%;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.45);
        }

        .menu-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 80%;
            max-width: 320px;
        }

        .menu-btn {
            background-color: rgba(255, 255, 255, 0.9);
            border: 2px solid #fff;
            border-radius: 12px;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            color: #333;
            cursor: pointer;
            transition: all 0.3s ease;
            display: block;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }

        .menu-btn:hover {
            transform: translateY(-3px);
            background-color: #fff;
            box-shadow: 0 15px 20px rgba(0,0,0,0.3);
        }

        .sub-menu {
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-top: -10px;
            margin-bottom: 5px;
        }

        .sub-menu.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .sub-btn {
            background-color: rgba(255, 255, 255, 0.85);
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            text-align: center;
            text-decoration: none;
            color: #222;
            width: 90%;
            margin: 0 auto;
            box-sizing: border-box;
            transition: background-color 0.2s;
        }

        .sub-btn:hover { background-color: #fff; }

        .music-btn {
            position: absolute;
            bottom: 25px;
            right: 25px;
            z-index: 10;
            background-color: rgba(255, 255, 255, 0.85);
            border: none;
            border-radius: 50%;
            width: 55px;
            height: 55px;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: transform 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .music-btn:hover {
            transform: scale(1.1);
            background-color: #fff;
        }
    </style>
</head>
<body>

    <div class="bg-image">
        <div class="overlay"></div>
        
        <div class="menu-container">
            <a href="schedule.html" class="menu-btn">Schedule</a>
            <a href="maps.html" class="menu-btn">Maps</a>
            <a href="list.html" class="menu-btn">List</a>
            <button class="menu-btn" onclick="toggleSubMenu()">Check List</button>
            
            <div class="sub-menu" id="checkListMenu">
                <a href="list-berangkat.html" class="sub-btn">List Berangkat</a>
                <a href="list-pulang.html" class="sub-btn">List Pulang</a>
            </div>
        </div>

        <!-- Tambahkan atribut autoplay -->
        <audio id="bgMusic" autoplay loop>
            <source src="Sesuatu Di Jogja - Adhitia Sofyan (official audio).mp3" type="audio/mpeg">
        </audio>

        <button class="music-btn" id="musicToggleBtn" onclick="toggleMusic()">⏸️</button>
    </div>

    <script>
        function toggleSubMenu() {
            const menu = document.getElementById("checkListMenu");
            menu.classList.toggle("active");
        }

        const music = document.getElementById("bgMusic");
        const musicBtn = document.getElementById("musicToggleBtn");
        let isPlaying = true; // Default nyala karena kita pakai autoplay

        // Fungsi ini memaksa lagu menyala saat ada sentuhan pertama di layar jika autoplay diblokir browser
        document.body.addEventListener('click', function() {
            if (!isPlaying && music.paused) {
                music.play();
                isPlaying = true;
                musicBtn.innerHTML = "⏸️";
            }
        }, { once: true }); // event hanya berjalan satu kali

        // Deteksi jika browser benar-benar memblokir autoplay di awal
        setTimeout(() => {
            if (music.paused) {
                isPlaying = false;
                musicBtn.innerHTML = "🎵";
            }
        }, 500);

        function toggleMusic() {
            if (isPlaying) {
                music.pause();
                musicBtn.innerHTML = "🎵";
            } else {
                music.play();
                musicBtn.innerHTML = "⏸️";
            }
            isPlaying = !isPlaying;
        }
    </script>
</body>
</html>
