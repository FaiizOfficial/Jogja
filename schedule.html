<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule - Trip to Jogja</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-image: url('jogja.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 20px; 
            border-radius: 12px; 
            width: 100%; 
            max-width: 350px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.4); 
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }
        h2 { text-align: center; color: #222; margin-top: 0; }
        
        /* Grid untuk tombol tanggal (4 hari: 26 s.d. 29) */
        .grid-container { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 12px; 
            margin-top: 20px; 
        }
        .date-btn { 
            background-color: #fff; 
            border: 2px solid #333; 
            border-radius: 10px; 
            padding: 20px 0; 
            font-size: 20px; 
            font-weight: bold; 
            cursor: pointer; 
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2); 
            transition: background-color 0.2s;
        }
        .date-btn:hover {
            background-color: #f0f0f0;
        }
        
        /* Tombol navigasi */
        .nav-btn { 
            background-color: #333; 
            color: white; 
            border: none; 
            padding: 10px; 
            border-radius: 5px; 
            cursor: pointer; 
            width: 100%; 
            font-size: 16px; 
            margin-bottom: 15px; 
            flex-shrink: 0;
        }
        .home-btn { margin-top: 20px; background-color: #6c757d; }

        /* Area list jadwal yang bisa di-scroll jika panjang */
        .schedule-scroll {
            overflow-y: auto;
            flex-grow: 1;
            margin-top: 10px;
            padding-right: 5px;
        }

        /* List jadwal */
        .timeline { list-style: none; padding: 0; margin: 0; }
        .timeline li { 
            display: flex; 
            flex-direction: column;
            margin-bottom: 12px; 
            border-bottom: 1px solid #ddd; 
            padding-bottom: 8px; 
        }
        .time { font-weight: bold; color: #0056b3; font-size: 13px; margin-bottom: 2px; }
        .activity { color: #333; font-size: 14px; }
        
        /* Gaya untuk jam realtime */
        .clock {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #d9534f;
            margin-top: 5px;
            margin-bottom: 10px;
            font-family: 'Courier New', Courier, monospace;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <!-- Tampilan 1: Pilih Tanggal -->
    <div id="view-dates" class="container">
        <h2>Pilih Tanggal</h2>
        <div class="grid-container">
            <button class="date-btn" onclick="showSchedule(26)">26 Sep</button>
            <button class="date-btn" onclick="showSchedule(27)">27 Sep</button>
            <button class="date-btn" onclick="showSchedule(28)">28 Sep</button>
            <button class="date-btn" onclick="showSchedule(29)">29 Sep</button>
        </div>
        <button class="nav-btn home-btn" onclick="window.location.href='index.html'">Kembali ke Menu Utama</button>
    </div>

    <!-- Tampilan 2: Detail Jadwal -->
    <div id="view-schedule" class="container" style="display: none;">
        <button class="nav-btn" onclick="showDates()">⬅ Kembali Pilih Tanggal</button>
        
        <h2 id="title-date" style="margin-bottom: 5px;"></h2>
        
        <!-- Wadah Jam Realtime -->
        <div class="clock" id="realtime-clock">00:00:00</div>
        
        <div class="schedule-scroll">
            <ul class="timeline" id="schedule-list"></ul>
        </div>
    </div>

    <script>
        const scheduleData = {
            26: {
                date: "26-September-2026",
                events: [
                    { time: "05:00 - 06:00", act: "OTW STASIUN SENEN" },
                    { time: "07:55 - 15:00", act: "OTW TANGERANG - JOGJA" },
                    { time: "15:00 - 15:40", act: "OTW KE VILLA" },
                    { time: "15:40 - 15:50", act: "CHECK IN DI VILLA" },
                    { time: "15:50 - 16:40", act: "RENTAL MOTOR ( COD DI VILLA )" },
                    { time: "16:40 - 18:00", act: "ISTIRAHAT DI VILLA ( MANDI )" },
                    { time: "18:00 - 19:00", act: "MAKAN MALAM" },
                    { time: "19:00 - 07:00", act: "ISTIRAHAT BOBO DI VILLA" }
                ]
            },
            27: {
                date: "27-September-2026",
                events: [
                    { time: "07:00 - 08:00", act: "MANDI DI VILLA" },
                    { time: "08:00 - 09:00", act: "SARAPAN DEKAT VILLA" },
                    { time: "09:00 - 09:30", act: "OTW CANDI PRAMBANAN" },
                    { time: "09:30 - 11:00", act: "CANDI PRAMBANAN" },
                    { time: "11:00 - 11:40", act: "MAKAN SIANG DEKET PRAMBANAN" },
                    { time: "11:40 - 12:20", act: "OTW KEDATHON JOGJA" },
                    { time: "12:20 - 13:20", act: "KEDATHON JOGJA" },
                    { time: "13:20 - 14:20", act: "TAMAN SARI" },
                    { time: "14:20 - 14:30", act: "OTW MUSEUM VREDEBURG" },
                    { time: "14:30 - 16:00", act: "MUSEUM VREDEBURG" },
                    { time: "16:00 - 16:15", act: "OTW TUGU JOGJA" },
                    { time: "16:15 - 17:00", act: "CAFFE TUGU JOGJA" },
                    { time: "17:00 - 17:20", act: "OTW MALIOBORO" },
                    { time: "17:20 - 18:00", act: "MALIOBORO" },
                    { time: "18:00 - 20:00", act: "MAKAN MALAM, KULINER MALIOBORO" },
                    { time: "20:00 - 20:30", act: "OTW VILLA" },
                    { time: "20:30 - 21:00", act: "MANDI DI VILLA" },
                    { time: "21:00 - 07:00", act: "ISTIRAHAT BOBO DI VILLA" }
                ]
            },
            28: {
                date: "28-September-2026",
                events: [
                    { time: "07:00 - 08:00", act: "MANDI DI VILLA" },
                    { time: "08:00 - 08:40", act: "SARAPAN DEKAT VILLA" },
                    { time: "08:40 - 09:10", act: "OTW MALIOBORO" },
                    { time: "09:10 - 09:30", act: "PRIPER FOTO SHOOT" },
                    { time: "09:30 - 10:30", act: "FOTO SHOOT (MALIOBORO)" },
                    { time: "10:30 - 10:50", act: "SELESAI FOTO SHOOT" },
                    { time: "10:50 - 11:50", act: "CARI MAKAN DEKET MALIOBORO" },
                    { time: "11:50 - 13:00", act: "CARI OLEH-OLEH" },
                    { time: "13:00 - 15:30", act: "KULINERAN DI MALIOBORO" },
                    { time: "15:30 - 17:00", act: "PASAR NGASEM / PASAR BERINGHARJO" },
                    { time: "17:00 - 18:00", act: "REFRESHING JALAN JALAN SANTAI" },
                    { time: "18:00 - 19:00", act: "MAKAN MALAM" },
                    { time: "19:00 - 20:00", act: "MALIOBORO / ALUN ALUN JOGJA" },
                    { time: "20:00 - 20:30", act: "OTW VILLA" },
                    { time: "20:30 - 07:00", act: "ISTIRAHAT BOBO DI VILLA" }
                ]
            },
            29: {
                date: "29-September-2026",
                events: [
                    { time: "07:00 - 08:00", act: "MANDI DI VILLA" },
                    { time: "08:00 - 09:00", act: "MAKAN DI VILLA" },
                    { time: "09:00 - 11:00", act: "PRIPER CHECK OUT VILLA" },
                    { time: "11:00 - 11:10", act: "CEK OUT VILLA" },
                    { time: "11:00 - 11:10", act: "OTW STASIUN JOGJA" },
                    { time: "11:10 - 12:20", act: "OTW JOGJA - KLATEN" },
                    { time: "12:20 - 12:40", act: "OTW RUMAH MBAH" },
                    { time: "12:40 - 13:20", act: "MAKAN - NGOBROL DIRUMAH MBAH" },
                    { time: "13:20 - 15:00", act: "JALAN-JALAN DI KLATEN" },
                    { time: "15:00 - 16:00", act: "PRIPER PULANG" },
                    { time: "16:00 - 16:20", act: "OTW KE DELANGGU" },
                    { time: "16:20 - 07:00", act: "OTW KLATEN - TANGERANG" }
                ]
            }
        };

        function showSchedule(dateKey) {
            // Sembunyikan grid tanggal, tampilkan detail jadwal
            document.getElementById('view-dates').style.display = 'none';
            document.getElementById('view-schedule').style.display = 'flex';

            const data = scheduleData[dateKey];
            
            // Masukkan tanggal bersih (misal: 26-September-2026)
            document.getElementById('title-date').innerText = data.date;

            const listElement = document.getElementById('schedule-list');
            listElement.innerHTML = ''; 
            
            data.events.forEach(item => {
                const li = document.createElement('li');
                li.innerHTML = `<span class="time">${item.time}</span> <span class="activity">${item.act}</span>`;
                listElement.appendChild(li);
            });
        }

        function showDates() {
            document.getElementById('view-dates').style.display = 'flex';
            document.getElementById('view-schedule').style.display = 'none';
        }

        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('realtime-clock').innerText = `${hours}:${minutes}:${seconds}`;
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
