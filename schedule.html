<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule - Trip to Jogja</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-image: url('jogja.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 20px; 
            border-radius: 12px; 
            width: 100%; 
            max-width: 350px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.4); 
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }
        h2 { text-align: center; color: #222; margin-top: 0; }
        
        .grid-container { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 12px; 
            margin-top: 20px; 
        }
        .date-btn { 
            background-color: #fff; 
            border: 2px solid #333; 
            border-radius: 10px; 
            padding: 20px 0; 
            font-size: 20px; 
            font-weight: bold; 
            cursor: pointer; 
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2); 
            transition: background-color 0.2s;
        }
        .date-btn:hover { background-color: #f0f0f0; }
        
        .nav-btn { 
            background-color: #333; 
            color: white; 
            border: none; 
            padding: 10px; 
            border-radius: 5px; 
            cursor: pointer; 
            width: 100%; 
            font-size: 16px; 
            margin-bottom: 15px; 
            flex-shrink: 0;
        }
        .home-btn { margin-top: 20px; background-color: #6c757d; }

        .schedule-scroll {
            overflow-y: auto;
            flex-grow: 1;
            margin-top: 5px;
            padding-right: 5px;
        }

        .timeline { list-style: none; padding: 0; margin: 0; }
        .timeline li { 
            display: flex; 
            flex-direction: column;
            margin-bottom: 12px; 
            border-bottom: 1px solid #ddd; 
            padding-bottom: 8px; 
            transition: background-color 0.3s;
            padding-left: 5px;
            border-radius: 4px;
        }
        
        /* Efek sorot untuk kegiatan yang sedang berlangsung */
        .timeline li.active-row {
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            border-bottom: 1px solid #ffeeba;
        }

        .time { font-weight: bold; color: #0056b3; font-size: 13px; margin-bottom: 2px; }
        .activity { color: #333; font-size: 14px; }
        
        .clock {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #d9534f;
            margin-top: 5px;
            margin-bottom: 8px;
            font-family: 'Courier New', Courier, monospace;
            flex-shrink: 0;
        }

        /* Kotak Keterangan Live Status di bawah jam */
        .live-status {
            background-color: #e8f4fd;
            border: 2px dashed #0056b3;
            border-radius: 8px;
            padding: 8px 10px;
            text-align: center;
            margin-bottom: 12px;
            font-size: 13px;
            color: #0056b3;
            font-weight: bold;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <!-- Tampilan 1: Pilih Tanggal -->
    <div id="view-dates" class="container">
        <h2>Pilih Tanggal</h2>
        <div class="grid-container">
            <button class="date-btn" onclick="showSchedule(26)">26 Sep</button>
            <button class="date-btn" onclick="showSchedule(27)">27 Sep</button>
            <button class="date-btn" onclick="showSchedule(28)">28 Sep</button>
            <button class="date-btn" onclick="showSchedule(29)">29 Sep</button>
        </div>
        <button class="nav-btn home-btn" onclick="window.location.href='index.html'">Kembali ke Menu Utama</button>
    </div>

    <!-- Tampilan 2: Detail Jadwal -->
    <div id="view-schedule" class="container" style="display: none;">
        <button class="nav-btn" onclick="showDates()">⬅ Kembali Pilih Tanggal</button>
        
        <h2 id="title-date" style="margin-bottom: 5px;"></h2>
        
        <!-- Jam Realtime -->
        <div class="clock" id="realtime-clock">00:00:00</div>
        
        <!-- Kotak Keterangan Status Otomatis -->
        <div class="live-status" id="live-status-box">Memuat status kegiatan...</div>
        
        <div class="schedule-scroll">
            <ul class="timeline" id="schedule-list"></ul>
        </div>
    </div>

    <script>
        const scheduleData = {
            26: {
                date: "26-September-2026",
                events: [
                    { time: "04:00 - 05:00", act: "PREPARE" },
                    { time: "05:00 - 06:00", act: "OTW STASIUN SENEN" },
                    { time: "06:00 - 07:55", act: "TUKER TIKET" },
                    { time: "07:55 - 15:50", act: "STASIUN SENEN - STASIUN LEMPUYANGAN" },
                    { time: "15:50 - 16:20", act: "COD MOTOR (DEPAN STASIUN)" },
                    { time: "16:30 - 17:10", act: "OTW VILLA" },
                    { time: "17:10 - 18:30", act: "CHECK IN & ISTIRAHAT" },
                    { time: "18:30 - 18:45", act: "OTW KOPI KLOTOK" },
                    { time: "18:45 - 20:20", act: "MAKAN & NGOPI DI KOPI KLOTOK" },
                    { time: "20:20 - 20:35", act: "OTW VILLA (MAMPIR KE INDOMARET)" },
                    { time: "20:35 - 06:00", act: "ISTIRAHAT" }
                ]
            },
            27: {
                date: "27-September-2026",
                events: [
                    { time: "06:00 - 06:20", act: "MASAK UNTUK SARAPAN" },
                    { time: "06:20 - 07:00", act: "SARAPAN & MANDI" },
                    { time: "07:00 - 07:40", act: "OTW CANDI PRAMBANAN" },
                    { time: "07:40 - 11:30", act: "EKSPLOR PRAMBANAN" },
                    { time: "11:30 - 12:00", act: "OTW GUDEG BU JUM" },
                    { time: "12:00 - 12:50", act: "MAKAN SIANG GUDEG BU JUM" },
                    { time: "12:50 - 13:15", act: "OTW PASAR NGASEM" },
                    { time: "13:15 - 13:40", act: "KULINERAN DI PASAR NGASEM" },
                    { time: "13:40 - 13:50", act: "OTW KERATON JOGJA" },
                    { time: "13:50 - 14:40", act: "EKSPLOR KERATON JOGJA" },
                    { time: "14:40 - 14:45", act: "OTW TAMAN SARI" },
                    { time: "14:45 - 15:20", act: "EKSPLORE TAMAN SARI" },
                    { time: "15:20 - 15:30", act: "OTW MUSEUM SENOBUDOYO" },
                    { time: "15:30 - 15:40", act: "OTW BENTENG VREDEBURG" },
                    { time: "15:40 - 16:20", act: "EKSPLORE BENTENG VREDEBURG" },
                    { time: "16:20 - 17:40", act: "OTW TUGU JOGJA" },
                    { time: "17:40 - 18:10", act: "MAKAN MALAM DI TUGU JOGJA" },
                    { time: "18:10 - 18:20", act: "OTW MALIOBORO" },
                    { time: "18:20 - 20:30", act: "EKSPLORE MALIOBORO" },
                    { time: "20:30 - 21:10", act: "OTW VILLA" },
                    { time: "21:10 - 06:00", act: "ISTIRAHAT" }
                ]
            },
            28: {
                date: "28-September-2026",
                events: [
                    { time: "06:00 - 07:30", act: "SARAPAN & MANDI" },
                    { time: "07:30 - 08:00", act: "OTW MALIOBORO" },
                    { time: "08:00 - 09:00", act: "PREPARE FOTO SHOOT" },
                    { time: "09:00 - 10:30", act: "FOTO PREWEDDING" },
                    { time: "10:30 - 10:50", act: "OTW PASAR BERINGHARJO" },
                    { time: "10:50 - 11:40", act: "MAKAN SIANG + BELI OLEH-OLEH DI PASAR BERINGHARJO" },
                    { time: "11:40 - 12:30", act: "OTW HUTAN PINUS" },
                    { time: "12:30 - 14:00", act: "NYANTAI DI HUTAN PINUS" },
                    { time: "14:00 - 15:30", act: "OTW IRBABO PARK" },
                    { time: "15:30 - 18:00", act: "WISATA IRBABO PARK" },
                    { time: "18:00 - 18:30", act: "OTW GASOTANG" },
                    { time: "18:30 - 19:30", act: "MAKAN MALAM GASOTANG" },
                    { time: "19:30 - 20:00", act: "OTW VILLA" },
                    { time: "20:00 - 21:00", act: "MANDI - PACKING" },
                    { time: "21:00 - 07:00", act: "ISTIRAHAT" }
                ]
            },
            29: {
                date: "29-September-2026",
                events: [
                    { time: "07:00 - 07:30", act: "MANDI" },
                    { time: "07:30 - 08:30", act: "CHECK BARANG MASUK KOPER" },
                    { time: "08:30 - 09:30", act: "PRIPARE" },
                    { time: "09:30 - 09:40", act: "CHECK OUT VILLA" },
                    { time: "09:40 - 10:10", act: "OTW ST LEMPUYANGAN" },
                    { time: "10:10 - 10:30", act: "BALIKIN MOTOR" },
                    { time: "10:30 - 11:30", act: "OTW KLATEN" },
                    { time: "11:30 - 11:50", act: "OTW RUMAH MBAH" },
                    { time: "11:50 - 13:00", act: "ISTIRAHAT DI RUMAH MBAH" },
                    { time: "13:00 - 16:30", act: "JALAN JALAN - MAKAN SIANG" },
                    { time: "16:30 - 17:00", act: "OTW RUMAH MBAH" },
                    { time: "17:00 - 17:30", act: "PRIPARE PULANG" },
                    { time: "17:30 - 17:50", act: "OTW DELANGGU" },
                    { time: "17:50 - 18:50", act: "NUNGGU BIS" },
                    { time: "18:50 - 03:00", act: "OTW TERMINAL PORIS PLAWAD" },
                    { time: "03:00 - 03:30", act: "OTW RUMAH" }
                ]
            }
        };

        let activeDateKey = null;

        function showSchedule(dateKey) {
            activeDateKey = dateKey;
            document.getElementById('view-dates').style.display = 'none';
            document.getElementById('view-schedule').style.display = 'flex';

            const data = scheduleData[dateKey];
            document.getElementById('title-date').innerText = data.date;

            const listElement = document.getElementById('schedule-list');
            listElement.innerHTML = ''; 
            
            data.events.forEach(item => {
                const li = document.createElement('li');
                li.innerHTML = `<span class="time">${item.time}</span> <span class="activity">${item.act}</span>`;
                listElement.appendChild(li);
            });

            updateClock(); // Langsung update status saat dibuka
        }

        function showDates() {
            activeDateKey = null;
            document.getElementById('view-dates').style.display = 'flex';
            document.getElementById('view-schedule').style.display = 'none';
        }

        function timeToMinutes(timeStr) {
            const parts = timeStr.trim().split(':');
            return parseInt(parts[0]) * 60 + parseInt(parts[1]);
        }

        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('realtime-clock').innerText = `${hours}:${minutes}:${seconds}`;

            // Cek status kegiatan jika sedang membuka halaman detail jadwal
            if (activeDateKey && scheduleData[activeDateKey]) {
                const currentTotalMin = now.getHours() * 60 + now.getMinutes();
                const events = scheduleData[activeDateKey].events;
                
                let activeEventText = "☕ Waktunya santai / Diluar jadwal utama";
                
                // Reset semua highlight baris
                const listItems = document.querySelectorAll('#schedule-list li');
                listItems.forEach(li => li.classList.remove('active-row'));

                events.forEach((item, idx) => {
                    const [startStr, endStr] = item.time.split('-');
                    const startMin = timeToMinutes(startStr);
                    const endMin = timeToMinutes(endStr);

                    let inRange = false;
                    // Handle rentang waktu normal vs melewati tengah malam (overnight)
                    if (startMin <= endMin) {
                        inRange = currentTotalMin >= startMin && currentTotalMin <= endMin;
                    } else {
                        inRange = currentTotalMin >= startMin || currentTotalMin <= endMin;
                    }

                    if (inRange) {
                        activeEventText = `⚡ SEDANG BERLANGSUNG:<br><span style="font-size:14px; color:#222;">${item.act}</span>`;
                        if (listItems[idx]) {
                            listItems[idx].classList.add('active-row');
                        }
                    }
                });

                document.getElementById('live-status-box').innerHTML = activeEventText;
            }
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
